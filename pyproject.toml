[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-ring-tools"
version = "0.1.0"
description = "Deployment diagnostics for the Anvil Ring outbound-only model-serving tunnel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "fakoli" }]
dependencies = []   # stdlib-only by design (mirrors anvil-events)

[project.urls]
Documentation = "https://fakoli.github.io/anvil-ring/"
Repository = "https://github.com/fakoli/anvil-ring"
Issues = "https://github.com/fakoli/anvil-ring/issues"

[project.optional-dependencies]
dev = ["pytest", "coverage>=7.6", "jsonschema[format]>=4.23", "ruff==0.11.12"]

[tool.ruff]
# Explicit rule scope (mirrors anvil-events / anvil-serving practice): do not
# rely on version-specific default rule sets.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

# The working tunnel runtime is the Rust `anvil-ring` binary in cargo/.  Python
# only ships the stdlib egress diagnostic, under an unambiguous executable name.
[project.scripts]
anvil-ring-probe-egress = "anvil_ring.probe_egress:main"

[tool.setuptools.packages.find]
include = ["anvil_ring*"]
