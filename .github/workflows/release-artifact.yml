name: release-artifact

# Enforces I-7: the shipped binary must be statically linked.
#
# Why CI and not a laptop: musl linking fails on macOS at LINK time, not compile
# time -- cargo hands the musl target to `cc`, which there is clang driving Apple's
# ld, and it rejects GNU ld flags (--as-needed, -Bstatic, --gc-sections). The Rust
# compiles fine; the toolchain can't link it. See docs/cross-build.md. Building here
# removes "which machine can produce the release?" from the project entirely.
#
# The `file` check is the gate, not a nicety: a binary that silently gained dynamic
# dependencies would still run on the builder and then fail to start on a rental
# whose base image has a different libc. That failure mode lives on the customer's
# box, which is the worst place to discover it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  musl:
    name: static musl build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: x86_64
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cargo

      # A build script in the dependency tree compiles C via cc-rs, which looks for
      # <arch>-linux-musl-gcc -- not the host cc. Ubuntu runners ship neither the
      # cross gcc nor a musl libc for it, so musl builds fail with
      #   cc-rs: failed to find tool "aarch64-linux-musl-gcc"
      # musl-tools provides musl-gcc plus the libc; the symlink gives cc-rs the
      # arch-prefixed name it actually asks for. (Caught by the first real CI run:
      # both matrix legs failed here identically, so it was toolchain, not config.)
      - name: Install musl cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # NOT musl-tools: musl-gcc is the NATIVE musl compiler, so symlinking it to
          # the arch-prefixed name cc-rs asks for yields a compiler whose collect2
          # falls back to the HOST /usr/bin/ld. That then chokes on the target's
          # self-contained crt1.o -- "Relocations in generic ELF (EM: 183)" is the aarch64
          # ELF machine id meeting an x86-64 linker. Compile succeeded; only the link
          # failed, which is what pinpoints the linker rather than the toolchain as a
          # whole. Need a real cross-gcc, which Ubuntu ships for the foreign arch.
          # Ubuntu ships musl cross compilers as multiarch gcc-* packages: a single
          # `gcc-musl-<arch>` whose -b flag selects the target. The host-arch variant
          # (gcc-<arch>-linux-musl) only exists for arches Ubuntu multiarch-es, which
          # is why x86_64 appeared to work and aarch64 did not.
          sudo apt-get install -y --no-install-recommends \
            "gcc-musl-${{ matrix.arch }}" "gcc-${{ matrix.arch }}-linux-gnu"
          # Provide the arch-prefixed name cc-rs asks for. gcc-musl-* installs as
          # <trip>-musl-gcc / musl-gcc-<arch> depending on release, so resolve it
          # rather than assuming a path.
          src="$(ls /usr/bin/*musl*gcc 2>/dev/null | grep -F "${{ matrix.arch }}" | head -1)"
          test -n "$src" || { echo '::error::no musl gcc found for ${{ matrix.arch }}'; ls /usr/bin/*musl* 2>/dev/null; exit 1; }
          sudo ln -sf "$src" "/usr/local/bin/${{ matrix.arch }}-linux-musl-gcc"
          "${{ matrix.arch }}-linux-musl-gcc" -dumpmachine | grep -q "^${{ matrix.arch }}" \
            || { echo "::error::cross gcc not actually targeting ${{ matrix.arch }}"; exit 1; }
          # Prove the linker is the cross one, not /usr/bin/ld, before a 100s build.
          "${{ matrix.arch }}-linux-musl-gcc" -print-prog-name=ld | tee /tmp/ldused
          grep -v "^/usr/bin/ld$" /tmp/ldused >/dev/null \
            || { echo "::error::cross gcc is still resolving the host ld"; exit 1; }
          "${{ matrix.arch }}-linux-musl-gcc" --version | head -1

      - name: Build (release, locked)
        working-directory: cargo
        run: cargo build --release --locked --target ${{ matrix.target }} --bin anvil-ring

      - name: Gate -- binary must be statically linked (I-7)
        run: |
          set -euo pipefail
          BIN="cargo/target/${{ matrix.target }}/release/anvil-ring"
          test -x "$BIN"
          info="$(file "$BIN")"
          echo "$info"
          # 'statically linked' is the pass condition. Anything else fails, so a
          # regression cannot sneak past by reporting something we did not spell
          # out. ldd is checked second: some toolchains print 'statically linked'
          # while still recording an interpreter.
          case "$info" in
            *"statically linked"*) ;;
            *) echo "::error::expected a static binary, got: $info"; exit 1 ;;
          esac
          if command -v ldd >/dev/null 2>&1; then
            out="$(ldd "$BIN" 2>&1 || true)"
            echo "$out"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "::error::ldd resolved dependencies: $out"; exit 1 ;;
            esac
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-ring-${{ matrix.arch }}-unknown-linux-musl
          path: cargo/target/${{ matrix.target }}/release/anvil-ring
          if-no-files-found: error

  tests:
    name: test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cargo
      # --test-threads=1 is load-bearing, not cosmetic: the integration suites
      # bind fixed loopback ports, so concurrent tests collide and fail in ways
      # that read like product defects.
      - name: Unit tests
        working-directory: cargo
        run: cargo test --lib --locked
      - name: Integration tests (serial -- fixed loopback ports)
        working-directory: cargo
        # The red I-6 test makes `cargo test` exit non-zero, so the serial run is
        # allowed to fail here and is asserted precisely below. Do NOT treat
        # continue-on-error as "green": a real regression must still fail the job,
        # which the next step enforces by naming the one expected failure.
        continue-on-error: true
        run: cargo test --locked -- --test-threads=1 | tee /tmp/integ.log

      - name: Assert only the known-open I-6 test is red
        run: |
          set -euo pipefail
          log=/tmp/integ.log
          test -s "$log" || { echo "::error::no test output captured"; exit 1; }
          echo "--- failing tests ---"
          awk '/^failures:$/{f=1;next} f&&/^ +[a-z]/{print} f&&/^$/{f=0}' "$log" \
            | sort -u | tee /tmp/failed.txt
          n=$(grep -c . /tmp/failed.txt || true)
          # Denominator first: an empty failure list can mean the suite never ran,
          # which must not read as success.
          echo "failing tests found: $n"
          test "$n" -eq 1 || { echo "::error::expected exactly 1 known-red test, got $n"; exit 1; }
          grep -q 'tether_death_midstream_ends_the_caller' /tmp/failed.txt \
            || { echo "::error::unexpected failing test (list above)"; exit 1; }
          # Guard the flip side: if I-6 is ever FIXED, that test going quiet would
          # also look like success. Force an explicit update to this gate instead.
          grep -E "^test result: FAILED\. 3 passed; 1 failed" "$log" >/dev/null \
            || { echo "::error::forward_e2e counts changed; update this gate deliberately"; exit 1; }
          echo "OK: the single red test is the known-open I-6 defect."
