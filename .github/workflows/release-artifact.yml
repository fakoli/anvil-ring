name: release-artifact

# Enforces the self-contained rental artifact requirement: the shipped binary
# must be statically linked.
#
# Why CI and not a laptop: musl linking fails on macOS at LINK time, not compile
# time -- cargo hands the musl target to `cc`, which there is clang driving Apple's
# ld, and it rejects GNU ld flags (--as-needed, -Bstatic, --gc-sections). The Rust
# compiles fine; the toolchain can't link it. See docs/cross-build.md. Building here
# removes "which machine can produce the release?" from the project entirely.
#
# The `file` check is the gate, not a nicety: a binary that silently gained dynamic
# dependencies would still run on the builder and then fail to start on a rental
# whose base image has a different libc. That failure mode lives on the customer's
# box, which is the worst place to discover it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Build and test jobs are read-only. Only the trusted attestation job can sign
# and publish attestations; pull requests never enter that job.
permissions:
  contents: read

jobs:
  musl:
    name: static musl build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            platform: arm64
            file_arch: ARM aarch64
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: amd64
            file_arch: x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: cargo

      # GitHub's hosted runner is x86_64. Without binfmt, Docker can pull the arm64
      # image but cannot exec /bin/sh in it (`exec format error`) -- exactly what the
      # first Docker run proved. This is Docker's canonical hosted-runner path;
      # x86_64 stays native and pays no emulation cost.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: matrix.platform == 'arm64'
        with:
          platforms: arm64

      # Build inside rust:1.85-alpine via Docker, mirroring docs/cross-build.md
      # Option A -- the project's own documented, intended path -- rather than
      # assembling a cross toolchain from apt packages on the runner.
      #
      # Why this replaced the apt approach: three attempts (musl-tools symlink ->
      # host /usr/bin/ld rejecting aarch64 crt1.o; gcc-<arch>-linux-musl existing only
      # for multiarch'd arches; gcc-musl-<arch> not existing at all, 'Unable to locate
      # package') were all guessing package names, each costing ~2 min. The alpine
      # image has musl as its NATIVE libc, so there is no cross linker to get wrong:
      # cc, as, and ld all already target musl for that arch. --platform makes Docker
      # emulate the target arch, which is exactly what aarch64-musl needs.
      - name: Build in rust:alpine (Docker, per docs/cross-build.md Option A)
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${{ matrix.platform }}" \
            -v "$PWD/cargo":/src -w /src \
            -v anvil-ring-registry-${{ matrix.arch }}:/usr/local/cargo/registry \
            rust:1.85-alpine@sha256:4333721398de61f53ccbe53b0b855bcc4bb49e55828e8f652d7a8ac33dd0c118 sh -c '
              set -eu
              apk add --no-cache musl-dev >/dev/null
              rustup target add ${{ matrix.target }} >/dev/null
              cargo build --release --locked --target ${{ matrix.target }} --bin anvil-ring
            '

      - name: Verify that the binary is statically linked
        run: |
          set -euo pipefail
          BIN="cargo/target/${{ matrix.target }}/release/anvil-ring"
          test -x "$BIN"
          info="$(file "$BIN")"
          echo "$info"
          # GNU `file` reports PIE static binaries as `static-pie linked`, not
          # `statically linked` -- the first x86_64 artifact proved that exact output.
          # Both are valid static artifacts. Architecture is checked too so a mislabeled
          # matrix artifact cannot pass the static check.
          case "$info" in
            *"${{ matrix.file_arch }}"*) ;;
            *) echo "::error::wrong architecture, expected ${{ matrix.file_arch }}: $info"; exit 1 ;;
          esac
          case "$info" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::expected a static binary, got: $info"; exit 1 ;;
          esac
          # Stronger than wording: a dynamic ELF has a PT_INTERP segment naming its
          # loader. A truly static / static-PIE executable has none.
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "::error::binary has a PT_INTERP loader segment -- it is dynamic"
            readelf -l "$BIN" | grep -A1 INTERP
            exit 1
          fi
          if command -v ldd >/dev/null 2>&1; then
            out="$(ldd "$BIN" 2>&1 || true)"
            echo "$out"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "::error::ldd resolved dependencies: $out"; exit 1 ;;
            esac
          fi

      - name: Generate target-specific Cargo SBOM
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          sha256sum cargo/Cargo.lock > "$RUNNER_TEMP/cargo-lock.sha256"
          cargo cyclonedx --manifest-path cargo/Cargo.toml --format json \
            --describe binaries --target '${{ matrix.target }}' \
            --target-in-filename --spec-version 1.5
          sha256sum -c "$RUNNER_TEMP/cargo-lock.sha256"

      - name: Package binary, SBOM, source identity, and checksums
        run: |
          python3 scripts/package_release.py \
            --binary 'cargo/target/${{ matrix.target }}/release/anvil-ring' \
            --sbom 'cargo/anvil-ring_bin_${{ matrix.target }}.cdx.json' \
            --target '${{ matrix.target }}' --output 'dist/${{ matrix.arch }}'
          cd 'dist/${{ matrix.arch }}'
          sha256sum -c SHA256SUMS
          sha256sum -c ARCHIVE-SHA256SUMS

      - name: Run the packaged executable without privileges
        run: |
          docker run --rm --platform 'linux/${{ matrix.platform }}' \
            --user 65534:65534 --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/dist/${{ matrix.arch }}:/artifact:ro" \
            --entrypoint /artifact/anvil-ring \
            rust:1.85-alpine@sha256:4333721398de61f53ccbe53b0b855bcc4bb49e55828e8f652d7a8ac33dd0c118 \
            --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anvil-ring-${{ matrix.arch }}-unknown-linux-musl
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  attest:
    name: sign verified artifacts (${{ matrix.arch }})
    needs: [musl, tests]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anvil-ring-${{ matrix.arch }}-unknown-linux-musl
          path: release

      - name: Verify transferred files
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c ARCHIVE-SHA256SUMS

      - name: Sign build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/anvil-ring
            release/*.tar.gz
          create-storage-record: false

      - name: Sign the binary's Cargo dependency inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/anvil-ring
          sbom-path: release/sbom.cdx.json
          create-storage-record: false

      - name: Retain signature bundles with the downloadable release
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" release/sbom.sigstore.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anvil-ring-${{ matrix.arch }}-attested
          path: release/
          if-no-files-found: error

  tests:
    name: test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: cargo
      # The integration suites ask the operating system for loopback ports and
      # then pass those addresses to child processes. Serial execution prevents
      # another test from claiming a port during that short handoff.
      #
      # Tether cancellation, caller termination, and the buffering negative
      # control are required passing regressions. Keep every target in one
      # mandatory suite so a fixed bug cannot become an expected failure.
      - name: All Rust tests
        working-directory: cargo
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Python diagnostics tests and lint
        run: |
          python3 -m pip install --disable-pip-version-check -e '.[dev]'
          python3 -m pytest -q
          python3 -m ruff check .
